<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E63B2E"><link rel="icon" href="bobby-hero.svg" type="image/svg+xml"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Super Bobby</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bangers&display=swap">
<style>
/* Layout: one-screen comic-book app. Sticky hero bar on top, one big panel below that swaps between screens.
   Single bright look on purpose (a 6-year-old's superhero comic), so colours are set explicitly in both host themes. */
:root{
  --paper:#FFF6E3; --ink:#1B1F3B; --red:#E63B2E; --blue:#2E7CF6; --yellow:#FFC83D; --green:#22A55F;
  --purple:#7B4DFF; --sky:#BFE6FF; --soft:#FFE9B8; --grey:#6B6F86; --white:#FFFFFF;
  --display:"Bangers","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --read:"Andika","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--read);font-size:20px;overscroll-behavior:none;
  background-image:radial-gradient(rgba(230,59,46,.10) 1.6px,transparent 1.7px);background-size:18px 18px;
  -webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3,.disp{font-family:var(--display);letter-spacing:.04em;font-weight:400;margin:0;text-wrap:balance}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);color:var(--white);border-bottom:5px solid var(--ink)}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{font-size:34px;flex:1;text-shadow:3px 3px 0 var(--ink);line-height:1}
.bar h1 small{display:block;font-size:17px;letter-spacing:.06em;opacity:.95;text-shadow:none;font-family:var(--read);font-weight:700}
.starpill{display:flex;align-items:center;gap:6px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 8px;font-family:var(--display);font-size:28px;box-shadow:3px 3px 0 var(--ink)}
.homebtn{background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-family:var(--display);font-size:24px;box-shadow:3px 3px 0 var(--ink);min-height:48px}
.avatar{width:62px;height:62px;flex:none}

/* comic panels */
.panel{background:var(--white);border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:20px}
.grid{display:grid;gap:18px}
.missions{grid-template-columns:repeat(2,minmax(0,1fr))}
.mission{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:4px solid var(--ink);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--ink);min-height:190px;transition:transform .12s}
.mission:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.mission .ic{font-size:56px;line-height:1}
.mission h3{font-size:34px;line-height:1}
.mission p{margin:0;font-size:18px;font-weight:700}
.mission .tick{position:absolute;top:-14px;right:-14px;width:58px;height:58px;border-radius:50%;background:var(--green);border:4px solid var(--ink);display:grid;place-items:center;color:var(--white);font-size:34px;transform:scale(0) rotate(-30deg);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.mission.done .tick{transform:scale(1) rotate(0)}
.m-morning{background:#FFE07A}.m-story{background:#9FD3FF}.m-spell{background:#B8F0C8}.m-hand{background:#FFB8B0}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero .big{width:170px;height:170px;flex:none}
.hero .txt{flex:1;min-width:240px}
.hero h2{font-size:48px;color:var(--red);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink);line-height:1}
.hero p{margin:.3em 0 0;font-size:22px;font-weight:700}
.daybadge{display:inline-block;background:var(--blue);color:var(--white);font-family:var(--display);font-size:26px;padding:4px 14px;border-radius:12px;border:3px solid var(--ink);margin-top:10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-size:30px;letter-spacing:.05em;padding:12px 26px;min-height:64px;border:4px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);background:var(--yellow);transition:transform .1s}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--white)}.btn.blue{background:var(--blue);color:var(--white)}.btn.green{background:var(--green);color:var(--white)}.btn.white{background:var(--white)}
.btn.small{font-size:22px;min-height:50px;padding:8px 16px}
.btn[disabled]{opacity:.45}
.title{font-size:44px;color:var(--ink);margin-bottom:12px}
.sub{font-size:20px;font-weight:700;color:var(--grey);margin:0 0 14px}
.linkbtn{font-size:16px;font-weight:700;color:var(--grey);text-decoration:underline;padding:10px}

/* morning */
.qcard{display:grid;gap:14px;text-align:center}
.qcard h2{font-size:42px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice button{border:4px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:18px 10px;font-family:var(--display);font-size:30px;display:grid;gap:6px;justify-items:center;min-height:170px}
.choice button span{font-size:64px;line-height:1}
.yes{background:#B8F0C8}.notyet{background:#E8E6F5}

/* story */
.shelf{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ep{border:4px solid var(--ink);border-radius:16px;padding:12px;background:var(--white);box-shadow:4px 4px 0 var(--ink);text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px}
.ep b{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--blue)}
.ep span{font-weight:700;font-size:17px;line-height:1.2}
.ep.read{background:#E4F8EA}.ep.locked{opacity:.4}.ep.next{background:var(--yellow)}
.reader{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.reader{grid-template-columns:1fr}.reader .scene{aspect-ratio:16/9}}
.scene{border:4px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--sky);aspect-ratio:4/3;max-width:100%;position:relative}
.scene svg{display:block;width:100%;height:100%}
.page{display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.ptext{font-size:36px;line-height:1.75;font-weight:400;word-spacing:.18em;margin:0}
.ptext .w{display:inline-block;padding:0 3px;border-radius:8px;cursor:pointer}
.ptext .w.hl{background:var(--yellow)}
.ptext .w.key{text-decoration:underline 4px var(--green);text-underline-offset:6px}
.pnum{font-family:var(--display);font-size:24px;color:var(--grey)}
.dots{display:flex;gap:8px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--white)}
.dots i.on{background:var(--blue)}
.quiz{display:grid;gap:12px}
.quiz button{border:4px solid var(--ink);border-radius:16px;padding:16px;font-size:26px;font-weight:700;background:var(--white);box-shadow:4px 4px 0 var(--ink);text-align:left;min-height:64px}
.quiz button.right{background:#B8F0C8}.quiz button.wrong{background:#FFD1CC}

/* spelling */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:96px}
.slot{width:76px;height:90px;border-bottom:6px solid var(--ink);display:grid;place-items:center;font-size:58px;font-weight:700}
.slot.ok{color:var(--green)}.slot.bad{color:var(--red)}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tile{width:80px;height:80px;border:4px solid var(--ink);border-radius:16px;background:var(--yellow);font-size:50px;font-weight:700;box-shadow:4px 4px 0 var(--ink)}
.tile[disabled]{opacity:.2}
.bigword{font-size:96px;font-weight:700;text-align:center;letter-spacing:.06em;margin:6px 0}

/* hero hands */
.steps{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.step{border:4px solid var(--ink);border-radius:18px;padding:14px;background:var(--white);box-shadow:4px 4px 0 var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative}
.step .ic{font-size:44px;line-height:1}
.step b{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.step span{font-size:16px;font-weight:700;color:var(--grey)}
.step.done{background:#E4F8EA}
.step.done::after{content:"✓";position:absolute;top:8px;right:12px;font-size:34px;color:var(--green);font-weight:700}
.tracewrap{position:relative;width:min(100%,460px);aspect-ratio:120/130;margin:0 auto;border:4px solid var(--ink);border-radius:20px;background:var(--white);touch-action:none;overflow:hidden}
.tracewrap svg,.tracewrap canvas{position:absolute;inset:0;width:100%;height:100%}
.tracewrap canvas{touch-action:none}
.fam{display:inline-block;font-family:var(--display);font-size:24px;padding:4px 14px;border-radius:12px;border:3px solid var(--ink);background:var(--soft)}
.tstars{font-size:46px;text-align:center;min-height:56px}
.gym{text-align:center;display:grid;gap:12px;justify-items:center}
.gym .ic{font-size:110px;line-height:1}
.gym h2{font-size:44px}
.timer{font-family:var(--display);font-size:60px;color:var(--red)}
.space-line{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;row-gap:18px;font-size:52px;font-weight:700}
.space-line .ch{padding:0 1px}
.space-line .gap{width:18px;height:64px;border-radius:8px;align-self:center}
.space-line .gap.on{width:46px;background:var(--sky);border:3px dashed var(--blue)}
.space-line .gap.bad{background:#FFD1CC;border-color:var(--red)}
.space-line .gap.miss{background:#FFF0A8;border:3px dashed #C99A00;width:46px}
.bd{display:grid;gap:16px;justify-items:center;text-align:center}
.bd .pic{font-size:110px;line-height:1}
.bd .word{font-size:84px;font-weight:700;letter-spacing:.06em}
.bd .word u{text-decoration:none;color:var(--purple);border-bottom:6px solid var(--purple)}
.bd .pick{display:flex;gap:24px}
.bd .pick button{width:130px;height:130px;font-size:96px;font-weight:700;border:5px solid var(--ink);border-radius:24px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);line-height:1}
.copybox{border:4px solid var(--ink);border-radius:18px;background:var(--white);padding:18px 22px;font-size:46px;line-height:1.3}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tips div{background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;font-size:18px}
.tips div b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.04em}
.photo{width:100%;max-width:100%;border:4px solid var(--ink);border-radius:16px;display:block}
.scorebox{display:grid;gap:10px}
.scorerow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:20px;font-weight:700;border-bottom:2px dashed #d8d2c2;padding-bottom:6px}
.scorerow .st{font-size:26px;white-space:nowrap}
.bigscore{font-family:var(--display);font-size:80px;color:var(--red);text-shadow:3px 3px 0 var(--ink);line-height:1}
.speech{background:var(--sky);border:4px solid var(--ink);border-radius:18px;padding:14px 18px;font-size:24px;font-weight:700}

/* trophies */
.track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.track i{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:var(--white);display:grid;place-items:center;font-style:normal;font-size:clamp(12px,2.6vw,24px);font-weight:700;color:var(--grey)}
.track i.on{background:var(--yellow);color:var(--ink)}
.trophy h3{font-size:32px}
.trophy p{margin:4px 0 10px;font-weight:700}
.reward{background:var(--soft);border:3px dashed var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;margin-top:10px}

/* grown-ups */
.gu label{display:block;font-weight:700;font-size:17px;margin:10px 0 4px}
.gu input[type=text],.gu input[type=date],.gu textarea{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);-webkit-user-select:text;user-select:text}
.gu .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.gu h3{font-size:30px;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.seg button{border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px;background:var(--white);min-height:46px}
.seg button.on{background:var(--blue);color:var(--white)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gallery figure{margin:0;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--white)}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gallery figcaption{padding:6px 8px;font-size:15px;font-weight:700}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.cmp{grid-template-columns:1fr}}
.chart{width:100%;height:auto;display:block}
.note{font-size:16px;color:var(--grey);font-weight:700}
.holdbtn{position:relative;overflow:hidden}
.holdbtn .fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(46,124,246,.25)}

/* celebration */
.burst{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none}
.burst div{font-family:var(--display);font-size:clamp(70px,16vw,170px);color:var(--yellow);-webkit-text-stroke:4px var(--ink);text-shadow:8px 8px 0 var(--red);transform:scale(0) rotate(-12deg);animation:pow 1.3s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pow{0%{transform:scale(0) rotate(-12deg)}35%{transform:scale(1.1) rotate(-6deg)}70%{transform:scale(1) rotate(-6deg);opacity:1}100%{transform:scale(1.3) rotate(-6deg);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(27,31,59,.55);z-index:40;display:grid;place-items:center;padding:20px}
.modal .panel{max-width:620px;width:100%;text-align:center;display:grid;gap:14px;justify-items:center}
.modal h2{font-size:54px;color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:14px;font-weight:700;z-index:60;max-width:90vw}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bar"><div class="in">
  <div class="avatar" id="barAvatar"></div>
  <h1>Super Bobby<small id="barSub">Hero training</small></h1>
  <div class="starpill"><span>⭐</span><span id="starCount">0</span></div>
  <button class="homebtn" id="homeBtn" hidden>Home</button>
</div></div>
<main class="wrap" id="app"><div class="panel"><h2 class="disp" style="font-size:40px">Loading Super Bobby…</h2><p>Getting your cape ready.</p></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="stories.js" charset="utf-8"></script>
<script>
(function(){
"use strict";
const S = window.STORIES || [];
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dkey = (d=new Date()) => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = () => dkey();
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);

/* ---------------- state + storage ---------------- */
let db=null, assets=null, sample=null;
let settings = {startDate:TODAY(), rewards:{reading:"",dry:"",ownbed:""}, photoId:"", readAloud:true, unlock:0};
let prog = {days:{}, stories:{}, stars:0, traces:{}};
let writing = {}; // id -> doc
const LS="superbobby.v1";
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({settings,prog,writing}))}catch(e){}}
function lsLoad(){try{const v=JSON.parse(localStorage.getItem(LS)||"null"); if(v){settings=Object.assign(settings,v.settings||{}); prog=Object.assign(prog,v.prog||{}); writing=Object.assign(writing,v.writing||{});}}catch(e){}}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
let saveT=null;
function save(){ lsSave(); clearTimeout(saveT); saveT=setTimeout(async()=>{ if(!db) return;
  try{ await db.doc("bobby/progress").set(JSON.parse(JSON.stringify(prog))); await db.doc("bobby/settings").set(JSON.parse(JSON.stringify(settings))); }catch(e){ toast("Couldn't save just now - will try again."); }
 },400); }
function day(k=TODAY()){ return prog.days[k] || (prog.days[k]={}); }
function dayNum(){ return Math.min(30, Math.max(1, daysBetween(settings.startDate, TODAY())+1)); }
function addStars(n){ prog.stars=(prog.stars||0)+n; $("#starCount").textContent=prog.stars; }
function count(field){ return Object.values(prog.days).filter(d=>d[field]===true).length; }
function storiesRead(){ return Object.keys(prog.stories||{}).length; }
function nextEp(){ for(const s of S){ if(!prog.stories[s.n]) return s; } return null; }
function readToday(){ return Object.entries(prog.stories).filter(([n,d])=>d===TODAY()).map(([n])=>+n); }
function currentEp(){ const t=readToday(); if(t.length) return S.find(s=>s.n===Math.max(...t)); return nextEp() || S[S.length-1]; }
function canReadNew(){ return readToday().length===0 || (settings.unlock||0) > 0; }

/* ---------------- sound, haptics, celebration ---------------- */
let ac=null;
function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==="suspended") ac.resume(); return ac; }
function tone(freq, t0, dur, type="sine", vol=.22){ const c=ctx(); if(!c) return; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,c.currentTime+t0); g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.015); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t0+dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.05); }
const sfx = {
  tap(){ tone(880,0,.08,"triangle",.12); buzz(10); },
  good(){ [784,988,1175,1568].forEach((f,i)=>tone(f,i*.08,.35,"triangle",.18)); buzz([20,40,20]); },
  star(){ [1319,1760,2093].forEach((f,i)=>tone(f,i*.06,.4,"sine",.15)); },
  nearly(){ tone(330,0,.18,"sine",.16); tone(294,.16,.25,"sine",.14); buzz(40); },
  fanfare(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,i===6?.9:.22,"square",.08)); [523,659,784].forEach(f=>tone(f,.84,.9,"triangle",.1)); buzz([30,60,30,60,80]); }
};
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
const POWS=["POW!","ZAP!","WHAM!","SUPER!","BOOM!","KAPOW!","YES!"];
function pow(word){ const b=document.createElement("div"); b.className="burst"; b.innerHTML="<div>"+esc(word||POWS[Math.floor(Math.random()*POWS.length)])+"</div>"; document.body.appendChild(b); setTimeout(()=>b.remove(),1400); }
function confettiBurst(big){ if(!window.confetti) return; const colors=["#E63B2E","#2E7CF6","#FFC83D","#22A55F","#7B4DFF"];
  confetti({particleCount:big?220:110,spread:big?120:80,origin:{y:.6},colors,scalar:big?1.3:1.1});
  if(big){ setTimeout(()=>{confetti({particleCount:120,angle:60,spread:70,origin:{x:0,y:.7},colors,shapes:["square"],scalar:1.4});confetti({particleCount:120,angle:120,spread:70,origin:{x:1,y:.7},colors,shapes:["square"],scalar:1.4});},350);
    setTimeout(()=>confetti({particleCount:160,spread:160,startVelocity:30,gravity:.6,ticks:400,origin:{y:0},colors,shapes:["square"],scalar:1.6}),800); } }

function pickVoice(){ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/en-GB/i.test(v.lang)&&/female|serena|kate|martha|libby|sonia|emma/i.test(v.name)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }

  if(opts.onboundary) u.onboundary=opts.onboundary; if(opts.onend) u.onend=opts.onend; speechSynthesis.speak(u); return u; }catch(e){ opts.onend&&opts.onend(); } }

SCREENS.read=function(arg){ const preview=typeof arg==="object"&&arg.preview; const n=preview?arg.n:arg; const st=S.find(s=>s.n===n); let p=0; const keyset=new Set(st.words.map(w=>w.toLowerCase()));
  function words(t){ return t.split(/(\s+)/).map(tok=>{ if(/^\s+$/.test(tok)) return " "; const clean=tok.replace(/[^A-Za-z']/g,"").toLowerCase().replace(/'s$/,""); return `<span class="w ${keyset.has(clean)?"key":""}" data-w="${esc(tok.replace(/[^A-Za-z']/g,""))}">${esc(tok)}</span>`; }).join(""); }
  function page(){ const pg=st.pages[p]; const last=p===st.pages.length-1;
    app.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 class="disp" style="font-size:34px;color:var(--blue)">${preview?"Preview · ":""}Night ${st.n}: ${esc(st.title)}</h2><div class="dots">${st.pages.map((_,i)=>`<i class="${i<=p?"on":""}"></i>`).join("")}</div></div>
     <div class="reader"><div class="scene">${sceneSVG(pg.s,pg.t)}</div>
     <div class="page"><p class="ptext" id="pt">${words(pg.t)}</p>
      <p class="note" style="margin:0">Tap a word to hear it. Green words are your spellings.</p>
      <div class="row"><button class="btn white small" id="back" ${p===0?"disabled":""}>◀</button><button class="btn blue small" id="aloud">🔊 Read to me</button><button class="btn green" id="next" style="flex:1">${last?"I read it! 🎉":"I read it! ▶"}</button></div></div></div></div>`;
    app.querySelectorAll(".w").forEach(w=>w.onclick=()=>{ app.querySelectorAll(".w.hl").forEach(x=>x.classList.remove("hl")); w.classList.add("hl"); say(w.dataset.w,{rate:.75}); });
    $("#aloud").onclick=()=>{ const spans=[...app.querySelectorAll(".w")]; let starts=[],pos=0; spans.forEach(s=>{starts.push(pos); pos+=s.textContent.length+1;});
      say(pg.t,{onboundary:e=>{ if(e.name&&e.name!=="word") return; let k=0; while(k+1<starts.length&&starts[k+1]<=e.charIndex) k++; spans.forEach(s=>s.classList.remove("hl")); spans[k]&&spans[k].classList.add("hl"); }, onend:()=>spans.forEach(s=>s.classList.remove("hl"))}); };
    $("#back").onclick=()=>{ if(p>0){p--;sfx.tap();page();} };
    $("#next").onclick=()=>{ sfx.star(); if(!preview){ addStars(1); save(); } if(last) quiz(); else { p++; page(); } };
  }

SCREENS.spell=function(){ const ep=currentEp(); const list=ep.words.slice(0,4); let wi=0, score=0;
  function look(){ if(wi>=list.length) return finish(); const w=list[wi];
    app.innerHTML=`<div class="panel qcard"><p class="sub" style="margin:0">Word ${wi+1} of ${list.length} · from Night ${ep.n}</p><h2>Look and say</h2><div class="bigword">${esc(w)}</div>
     <div class="row" style="justify-content:center"><button class="btn blue" id="hear">🔊 Hear it</button><button class="btn green" id="ready">I'm ready! ▶</button></div><p class="note">Say the sounds: ${w.split("").join(" - ")}</p></div>`;
    say(w,{rate:.7}); $("#hear").onclick=()=>say(w,{rate:.7}); $("#ready").onclick=()=>{sfx.tap();build(w,0);}; }
  function build(w, fails){ const extra="abcdefghilmnoprstu".split("").filter(c=>!w.includes(c)).sort(()=>Math.random()-.5).slice(0,Math.min(3,7-w.length>0?3:2));
    const tiles=(w.split("").concat(extra)).map((c,i)=>({c,i})).sort(()=>Math.random()-.5); let typed=[];
    app.innerHTML=`<div class="panel qcard"><p class="sub" style="margin:0">Word ${wi+1} of ${list.length}</p><h2>Build the word!</h2><button class="linkbtn" id="hear" style="font-size:22px">🔊 Hear the word again</button>
     <div class="slots" id="slots">${w.split("").map(()=>`<div class="slot"></div>`).join("")}</div>
     <div class="tiles" id="tiles">${tiles.map(t=>`<button class="tile" data-i="${t.i}">${esc(t.c)}</button>`).join("")}</div>
     <div class="row" style="justify-content:center"><button class="btn white small" id="undo">⌫ Undo</button><button class="btn white small" id="peek">👀 Peek</button></div></div>`;
    say(w,{rate:.7}); $("#hear").onclick=()=>say(w,{rate:.7});
    const slots=[...app.querySelectorAll(".slot")];
    function draw(){ slots.forEach((s,i)=>{ s.textContent=typed[i]?typed[i].c:""; s.className="slot"; }); }
    app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{ if(typed.length>=w.length) return; sfx.tap(); typed.push({c:b.textContent,b}); b.disabled=true; draw(); try{say(b.textContent,{rate:.8});}catch(e){} if(typed.length===w.length) check(); });
    $("#undo").onclick=()=>{ const t=typed.pop(); if(t){t.b.disabled=false; draw();} };
    $("#peek").onclick=()=>{ fails=Math.max(fails,1); const sl=$("#slots"); const old=sl.innerHTML; sl.innerHTML=`<div class="bigword">${esc(w)}</div>`; setTimeout(()=>{sl.innerHTML=old; slots.splice(0,slots.length,...app.querySelectorAll(".slot")); draw();},1800); };
    function check(){ const got=typed.map(t=>t.c).join(""); if(got===w){ slots.forEach(s=>s.classList.add("ok")); if(fails===0){score++; addStars(2);} else addStars(1); save(); celebrate(false); say(w+"! Super spelling!"); setTimeout(()=>{wi++;look();},1500); }
      else { slots.forEach((s,i)=>s.classList.add(typed[i].c===w[i]?"ok":"bad")); sfx.nearly(); say("Nearly! Let's try again."); setTimeout(()=>build(w,fails+1),1600); } }
  }
  function finish(){ const d=day(); const first=!d.spell; d.spell=true; if(first) addStars(3); save(); celebrate(true,"SPELL-TASTIC!");
    app.innerHTML=`<div class="panel qcard"><h2>Spelling power up!</h2><p style="font-size:26px;font-weight:700;margin:0">${score} of ${list.length} first time.</p><div class="speech">Look out for these words in tonight's story: ${list.map(esc).join(", ")}</div><div class="row" style="justify-content:center"><button class="btn red" id="h">Back to base</button><button class="btn white small" id="again">Do them again</button></div></div>`;
    $("#h").onclick=()=>go("home"); $("#again").onclick=()=>go("spell"); }

    const ref=strokes.map(dpath=>{ const p=document.createElementNS(NS,"path"); p.setAttribute("d",dpath); sv.appendChild(p); const len=p.getTotalLength(); const pts=[]; for(let t=0;t<=len;t+=1.5){ const q=p.getPointAtLength(t); pts.push({x:q.x,y:q.y,t:t/len}); } p.remove(); return pts; });
    $("#starts").innerHTML=ref.map((pts,i)=>`<circle cx="${pts[0].x}" cy="${pts[0].y}" r="5.5" fill="#22A55F" stroke="#1B1F3B" stroke-width="1.2"/><text x="${pts[0].x}" y="${pts[0].y+0.3}" font-size="6.5" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`).join("");
    const cv=$("#cv"), tw=$("#tw"); let user=[], cur=null, penSeen=false;
    function size(){ const r=tw.getBoundingClientRect(), dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; redraw(); }
    function toV(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*120-10, y:(e.clientY-r.top)/r.height*130-15}; }
    function redraw(){ const g=cv.getContext("2d"), r=cv.width/120; g.clearRect(0,0,cv.width,cv.height); g.lineCap="round"; g.lineJoin="round"; g.strokeStyle="#2E7CF6"; g.lineWidth=6*r;
      user.forEach(s=>{ g.beginPath(); s.forEach((p,i)=>{ const X=(p.x+10)*r, Y=(p.y+15)*r; i?g.lineTo(X,Y):g.moveTo(X,Y); }); if(s.length===1){const X=(s[0].x+10)*r,Y=(s[0].y+15)*r; g.lineTo(X+.1,Y);} g.stroke(); }); }
    cv.addEventListener("pointerdown",e=>{ if(e.pointerType==="pen") penSeen=true; if(penSeen&&e.pointerType==="touch") return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(err){} cur=[toV(e)]; user.push(cur); redraw(); });

    const on=new Set(); let tries=0;
    function draw(){ $("#sl").innerHTML=chars.map((c,i)=>`<span class="ch">${esc(c)}</span>${i<chars.length-1?`<button class="gap ${on.has(i)?"on":""}" data-i="${i}" aria-label="space"></button>`:""}`).join("");
      app.querySelectorAll(".gap").forEach(g=>g.onclick=()=>{ const i=+g.dataset.i; on.has(i)?on.delete(i):on.add(i); sfx.tap(); draw(); }); }
    app.innerHTML=`<div class="panel qcard"><p class="sub" style="margin:0">${r+1} of ${rounds.length}</p><h2>Oh no! The words are squashed!</h2><p style="font-size:22px;font-weight:700;margin:0">Tap between letters to add finger spaces.</p><div class="space-line" id="sl"></div><div class="row" style="justify-content:center"><button class="btn white small" id="h">🔊 Hear it</button><button class="btn green" id="c">Check ⭐</button></div></div>`;
    draw(); $("#h").onclick=()=>say(sent); say(sent);
    $("#c").onclick=()=>{ const right=[...spaceAfter].every(i=>on.has(i)) && [...on].every(i=>spaceAfter.has(i));
      if(right){ if(!tries){ok++; addStars(2);} celebrate(false); say(sent); setTimeout(()=>{r++;show();},1400); }
      else { tries++; sfx.nearly(); app.querySelectorAll(".gap").forEach(g=>{ const i=+g.dataset.i; if(on.has(i)&&!spaceAfter.has(i)) g.classList.add("bad"); if(!on.has(i)&&spaceAfter.has(i)&&tries>1) g.classList.add("miss"); }); say(tries>1?"The yellow gaps need a space.":"Nearly! Say it slowly and listen for each word."); } };
  }
  show(); };

SCREENS.h_paper=function(kind){ kind=kind||"daily"; const ep=currentEp(); const sentence = kind==="daily" ? ep.write : "Bobby and Daisy play in the big barn.";
  const key="w-"+TODAY()+"-"+kind; const existing=writing[key]; let file=null;
  app.innerHTML=`<div class="grid"><div class="panel"><h2 class="title">${kind==="daily"?"Paper Mission":kind==="baseline"?"Day 1 Writing Test":"Day 30 Writing Test"}</h2>
   <p class="sub">${kind==="daily"?"Copy this onto lined paper with your pencil.":"Write this sentence, then your name underneath."}</p>
   <div class="copybox">${esc(sentence)}</div>
   <div class="row" style="margin-top:12px"><button class="btn blue small" id="hear">🔊 Hear it</button></div></div>
   <div class="tips"><div><b>🐊 Crocodile grip</b>Pinch, then rest on your middle finger.</div><div><b>🌱 Sit on the grass</b>Letters sit on the line.</div><div><b>👆 Finger spaces</b>A finger between each word.</div><div><b>🐢 Slow and steady</b>Neat beats fast.</div></div>
   <div class="panel" id="ph"><h3 class="disp" style="font-size:32px">Done? Take a photo!</h3>
    <p class="note">Hold the tablet straight above the paper, in good light.</p>
    <div class="row"><label class="btn green" for="cam" style="display:inline-flex;align-items:center">📸 Take photo</label><input id="cam" type="file" accept="image/*" capture="environment" class="vh">
    <button class="btn white small" id="nophoto">I wrote it (no photo)</button></div>
    <div id="res" style="margin-top:14px"></div></div></div>`;
  $("#hear").onclick=()=>say(sentence);
  if(existing) showResult(existing);
  $("#nophoto").onclick=()=>{ handStep("paper"); go("hand"); };
  $("#cam").onchange=async e=>{ file=e.target.files[0]; if(!file) return; const url=URL.createObjectURL(file);
    $("#res").innerHTML=`<img class="photo" src="${url}" alt="Bobby's writing"><p class="note" id="up"><span class="spin">⭐</span> Saving your photo…</p>`;
    const doc={date:TODAY(),day:dayNum(),kind,sentence,assetId:"",localImg:"",score:null};
    if(assets){ try{ const r=await assets.upload(file); doc.assetId=r.id; $("#up").textContent="Photo saved!"; }catch(err){ $("#up").textContent="Couldn't save the photo ("+(err&&err.code||"error")+"). The score still works."; } }
    else { try{ await idbPut(key, await shrink(file)); doc.localImg=key; $("#up").textContent="Photo saved on this tablet!"; }catch(err){ $("#up").textContent="Couldn't save the photo on this tablet."; } }
    writing[key]=doc; saveWriting(key); handStep("paper"); scoreIt(doc,file); };
  function showResult(doc){ $("#res").innerHTML=photoTag(doc,"photo","Bobby's writing")+(doc.score?scoreHTML(doc.score):`<p class="note">Photo saved.${sample?" Take a new one to get a Super Score.":""}</p>`); hydrateImgs(); }
  async function scoreIt(doc,f){ const box=document.createElement("div"); box.style.marginTop="14px"; $("#res").appendChild(box);
    if(!sample){ celebrate(false,"GREAT WRITING!"); box.innerHTML=`<div class="speech">🦸 Super writing, Bobby! Show Mummy or Daddy.</div>`; say("Super writing, Bobby! Show Mummy or Daddy."); return; }
    box.innerHTML=`<button class="btn red" id="sc">⭐ Get my Super Score</button>`;
    $("#sc").onclick=async()=>{ box.innerHTML=`<p style="font-size:24px;font-weight:700"><span class="spin">⭐</span> Super Bobby's coach is looking…</p>`;
      try{ const r=await sample.json(scorePrompt(doc.sentence,doc.kind),{images:f}); doc.score=r; writing[key]=doc; saveWriting(key); box.innerHTML=scoreHTML(r); celebrate(r.overall>=60,"SUPER SCORE!"); say((r.praise||"")+" "+(r.tip||"")); }
      catch(err){ box.innerHTML=`<p class="note">The coach couldn't look just now (${esc(err&&err.code||"error")}). Your photo is saved, try the score again later.</p>`; } }; }
};
function scorePrompt(sentence,kind){ return `This photo shows handwriting by Bobby, a 6-year-old boy in Year 2 (UK) who finds handwriting hard. He was asked to copy: "${sentence}"${kind!=="daily"?" and then write his name":""}.
Look closely at the writing in the photo and score each area from 1 (needs lots of help) to 5 (great for his age):
- formation: are letters formed correctly and readable (not backwards)?
- size: are letters a steady size (tall letters tall, small letters small)?
- line: do letters sit on the line?
- spacing: are there clear spaces between words, not squashed or spread out?
- caps: are capital letters only where they should be (not mixed into words)?
Also list any letters written backwards (e.g. b/d, s, j) in "reversed" (empty array if none).
"overall" is 0-100 for a child of his age. Be fair but kind.
"praise": one short happy sentence to Bobby (simple words, max 15 words, call him Bobby).
"tip": one tiny tip for next time (simple words, max 12 words).
"grownup": 1-2 plain factual sentences for his parents about what you see (including grip/pressure clues if visible, e.g. very dark heavy lines).
If the photo shows no handwriting, give overall 0 and say so in grownup.
Reply with only JSON like {"formation":3,"size":2,"line":3,"spacing":2,"caps":4,"reversed":["d"],"overall":55,"praise":"...","tip":"...","grownup":"..."}`; }
const SCORE_ROWS=[["formation","Letter shapes"],["size","Letter size"],["line","Sitting on the line"],["spacing","Finger spaces"],["caps","Capitals in the right place"]];
function scoreHTML(r){ const st=n=>{n=Math.max(0,Math.min(5,Math.round(+n||0))); return "⭐".repeat(n)+"☆".repeat(5-n);};
  return `<div class="scorebox"><div class="row"><span class="bigscore">${Math.round(+r.overall||0)}</span><span style="font-family:var(--display);font-size:30px">SUPER SCORE</span></div>
  ${SCORE_ROWS.map(([k,l])=>`<div class="scorerow"><span>${l}</span><span class="st">${st(r[k])}</span></div>`).join("")}
  ${(r.reversed&&r.reversed.length)?`<div class="scorerow"><span>Backwards letters</span><span>${r.reversed.map(esc).join(", ")}</span></div>`:""}
  <div class="speech">🦸 ${esc(r.praise||"")}<br>💡 ${esc(r.tip||"")}</div></div>`; }
async function saveWriting(key){ lsSave(); if(!db) return; try{ await db.doc("writing/"+key).set(JSON.parse(JSON.stringify(writing[key]))); }catch(e){ toast("Couldn't save the writing record."); } }

/* ---------------- TROPHIES ---------------- */
SCREENS.trophies=function(){ const rw=settings.rewards||{}; const rows=[
  ["ownbed","🦸","Brave nights on my own",count("ownbed"),rw.ownbed],
  ["dry","☀️","Dry beds",count("dry"),rw.dry],
  ["reading","📖","Stories read",storiesRead(),rw.reading]];
  const traced=Object.keys(prog.traces||{}).length;
  app.innerHTML=`<div class="grid"><div class="panel hero"><div class="big">${capeStar(count("ownbed"))}</div><div class="txt"><h2>My Trophies</h2><p>${prog.stars||0} stars collected · ${traced} letters trained</p></div></div>
  ${rows.map(([f,ic,t,n,r])=>`<div class="panel trophy"><h3>${ic} ${t}: ${n} of 30</h3><div class="track">${Array.from({length:30},(_,i)=>`<i class="${i<n?"on":""}">${i<n?"★":i+1}</i>`).join("")}</div>${r?`<div class="reward">🎁 At 30: ${esc(r)}</div>`:""}</div>`).join("")}
  </div>`; };

/* ---------------- GROWN-UPS ---------------- */
SCREENS.grown=function(){ const d=day(); const n=d.notes||{}; const ws=Object.entries(writing).sort((a,b)=>a[0]<b[0]?-1:1);
  const base=ws.find(([k,w])=>w.kind==="baseline"), fin=[...ws].reverse().find(([k,w])=>w.kind==="final"), latest=[...ws].reverse().find(([k,w])=>w.score);
  const NOTE=[["grip","Pencil grip",["Good","Awkward"]],["press","Pressure",["OK","Too hard","Too light"]],["tired","Hand got tired",["No","Yes"]],["mood","Happy to write?",["Yes","Reluctant","Refused"]]];
  app.innerHTML=`<div class="grid gu">
  <div class="panel"><h3>Grown-ups</h3><p class="note">${db?"Everything saves to your Claude account, so you can check progress from your phone too.":"Everything saves on this tablet. Don't clear Chrome's data or history for this site, or his progress will be lost."}</p>
   <div class="two"><div>
    <label for="sd">Day 1 was</label><input id="sd" type="date" value="${esc(settings.startDate)}">
    <label for="r1">Prize at 30 brave nights on his own</label><input id="r1" type="text" value="${esc(settings.rewards.ownbed||"")}" placeholder="e.g. new Lego set">
    <label for="r2">Prize at 30 dry beds</label><input id="r2" type="text" value="${esc(settings.rewards.dry||"")}">
    <label for="r3">Prize at 30 stories</label><input id="r3" type="text" value="${esc(settings.rewards.reading||"")}">
    <div class="row" style="margin-top:12px"><button class="btn green small" id="sv">Save</button></div></div>
    <div>${assets?`<label>Bobby's photo (goes in his hero badge)</label><div class="row">${heroSVG(110)}<label class="btn white small" for="pf" style="display:inline-flex;align-items:center">📷 Choose photo</label><input id="pf" type="file" accept="image/*" class="vh"></div>`:`<div class="row">${heroSVG(110)}</div>`}
     <label>Story lock</label><p class="note" style="margin:0 0 8px">One new story a day. Missed a night? Let him read one extra.</p><button class="btn white small" id="unl">Unlock one extra story${settings.unlock?` (${settings.unlock} waiting)`:""}</button></div></div></div>
  <div class="panel"><h3>Read the stories yourself</h3><p class="note">Preview mode: no stars, nothing marked as read, Bobby's next night stays locked for him.</p>
   <div class="grid shelf">${S.map(s=>`<button class="ep" data-pv="${s.n}"><b>Night ${s.n}</b><span>${esc(s.title)}</span></button>`).join("")}</div></div>
  <div class="panel"><h3>Today's handwriting notes</h3><p class="note">A quick record of what you see, useful for school or an OT assessment.</p>
   ${NOTE.map(([k,l,opts])=>`<label>${l}</label><div class="seg" data-k="${k}">${opts.map(o=>`<button class="${n[k]===o?"on":""}">${o}</button>`).join("")}</div>`).join("")}
   <label for="nt">Anything else</label><textarea id="nt" rows="2">${esc(n.text||"")}</textarea></div>
  <div class="panel"><h3>Writing tests: Day 1 vs Day 30</h3><p class="note">Same sentence both times so it's a fair comparison. Do the Day 1 test now, and the Day 30 test at the end.</p>
   <div class="row"><button class="btn blue small" id="bt">${base?"Redo":"Do"} Day 1 test</button><button class="btn red small" id="ft">Day 30 test</button></div>
   <div class="cmp" style="margin-top:14px">${cmpCol("Day 1",base)}${cmpCol("Day 30",fin)}</div>
   ${base&&fin&&base[1].score&&fin[1].score?`<div class="speech" style="margin-top:14px">Super Score went from ${base[1].score.overall} to ${fin[1].score.overall} (${fin[1].score.overall-base[1].score.overall>=0?"+":""}${fin[1].score.overall-base[1].score.overall}).</div>`:""}
   ${latest?`<p class="note" style="margin-top:12px">Latest coach note: ${esc(latest[1].score.grownup||"")}</p>`:""}</div>
  <div class="panel"><h3>Super Score over 30 days</h3>${chartHTML(ws)}</div>
  <div class="panel"><h3>All writing photos</h3><div class="gallery">${ws.filter(([k,w])=>w.assetId||w.localImg).map(([k,w])=>`<figure>${photoTag(w,"","Writing day "+w.day)}<figcaption>Day ${w.day} · ${w.kind==="daily"?"daily":w.kind==="baseline"?"Day 1 test":"Day 30 test"}${w.score?` · ${w.score.overall}`:""}</figcaption></figure>`).join("")||`<p class="note">No photos yet. They appear here after each Paper Mission.</p>`}</div></div>
  </div>`;
  $("#sv").onclick=()=>{ settings.startDate=$("#sd").value||settings.startDate; settings.rewards={ownbed:$("#r1").value.trim(),dry:$("#r2").value.trim(),reading:$("#r3").value.trim()}; save(); renderBar(); toast("Saved."); };
  $("#unl").onclick=()=>{ settings.unlock=(settings.unlock||0)+1; save(); toast("One extra story unlocked."); go("grown"); };
  hydrateImgs();
  app.querySelectorAll("[data-pv]").forEach(b=>b.onclick=()=>go("read",{n:+b.dataset.pv,preview:true}));
  $("#bt").onclick=()=>go("h_paper","baseline"); $("#ft").onclick=()=>go("h_paper","final");
  app.querySelectorAll(".seg").forEach(sg=>sg.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const dd=day(); dd.notes=dd.notes||{}; dd.notes[sg.dataset.k]=b.textContent; save(); sg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); }));
  $("#nt").onchange=e=>{ const dd=day(); dd.notes=dd.notes||{}; dd.notes.text=e.target.value; save(); };
  $("#pf").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; if(!assets){ toast("Photos need the Claude app view."); return; } try{ toast("Saving photo…"); const r=await assets.upload(f); settings.photoId=r.id; save(); renderBar(); go("grown"); toast("Hero badge updated!"); }catch(err){ toast("Couldn't save the photo ("+(err&&err.code||"error")+")."); } };
};
function cmpCol(label,entry){ if(!entry) return `<div><b class="disp" style="font-size:26px">${label}</b><p class="note">Not done yet.</p></div>`; const w=entry[1];
  return `<div><b class="disp" style="font-size:26px">${label} · ${esc(w.date)}</b>${photoTag(w,"photo",label+" writing")}${w.score?scoreHTML(w.score):sample?`<p class="note">No score yet.</p>`:""}</div>`; }
function photoTag(w,cls,alt){ if(w.assetId) return `<img class="${cls}" src="/_blob/${w.assetId}" alt="${esc(alt)}">`; if(w.localImg) return `<img class="${cls}" data-local="${esc(w.localImg)}" alt="${esc(alt)}">`; return ""; }
function hydrateImgs(){ document.querySelectorAll("img[data-local]").forEach(async im=>{ try{ const b=await idbGet(im.dataset.local); if(b) im.src=URL.createObjectURL(b); }catch(e){} }); }
/* photos kept on the tablet itself when there is no Claude account behind the page */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("superbobby",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbPut(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction("photos","readwrite"); t.objectStore("photos").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const q=d.transaction("photos").objectStore("photos").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
function shrink(file){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,1400/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext("2d").drawImage(im,0,0,c.width,c.height); c.toBlob(b=>res(b||file),"image/jpeg",.75); }; im.onerror=()=>res(file); im.src=URL.createObjectURL(file); }); }
function chartHTML(ws){ const pts=ws.filter(([k,w])=>w.score&&typeof w.score.overall==="number").map(([k,w])=>({d:w.day,v:w.score.overall}));
  if(pts.length<2) return `<p class="note">The line appears after two scored photos.</p>`;
  const W=600,H=220,L=36,B=28,x=d=>L+(d-1)/29*(W-L-12),y=v=>H-B-(v/100)*(H-B-12);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Super Score by day">${[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-12}" y1="${y(v)}" y2="${y(v)}" stroke="#E7E1D2"/><text x="${L-6}" y="${y(v)+5}" font-size="13" text-anchor="end" fill="#6B6F86">${v}</text>`).join("")}
   ${[1,10,20,30].map(d=>`<text x="${x(d)}" y="${H-8}" font-size="13" text-anchor="middle" fill="#6B6F86">Day ${d}</text>`).join("")}
   <polyline fill="none" stroke="#2E7CF6" stroke-width="4" stroke-linejoin="round" points="${pts.map(p=>x(p.d)+","+y(p.v)).join(" ")}"/>
   ${pts.map((p,i)=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="${i===pts.length-1?7:4.5}" fill="${i===pts.length-1?"#E63B2E":"#2E7CF6"}" stroke="#fff" stroke-width="2"/>`).join("")}</svg>`; }

/* ---------------- boot ---------------- */
lsLoad(); go("home");
document.addEventListener("pointerdown",()=>ctx(),{once:true});
(async function connect(){ if(!window.claude||!claude.use) return;
  try{ db=await claude.use("db"); }catch(e){}
  try{ assets=await claude.use("assets"); }catch(e){}
  try{ sample=await claude.use("sample"); }catch(e){}
  if(!db) return;
  try{ const [p,s,w]=await Promise.all([db.doc("bobby/progress").get(),db.doc("bobby/settings").get(),db.collection("writing").get()]);
    // the shared store is the truth: if it has been reset, this device's old copy is dropped too
    prog = p.exists ? JSON.parse(JSON.stringify(Object.assign({days:{},stories:{},stars:0,traces:{}},p.data()))) : {days:{},stories:{},stars:0,traces:{}};
    if(s.exists){ settings=Object.assign(settings,JSON.parse(JSON.stringify(s.data()))); settings.rewards=settings.rewards||{}; }
    else { settings={startDate:TODAY(),rewards:{reading:"",dry:"",ownbed:""},photoId:"",readAloud:true,unlock:0}; await db.doc("bobby/settings").set(JSON.parse(JSON.stringify(settings))); }
    w.docs.forEach(d=>{ writing[d.id]=JSON.parse(JSON.stringify(d.data())); });
    lsSave(); if(screen==="home"||screen==="trophies"||screen==="grown") go(screen); else renderBar();
  }catch(e){ toast("Working offline on this tablet for now."); }
})();
})();
</script>

</body></html>
